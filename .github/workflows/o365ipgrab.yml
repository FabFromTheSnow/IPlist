name: Update Microsoft 365 IPs

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Microsoft 365 IP lists
        run: python scripts/update_m365_ips.py

      - name: Show generated files
        run: |
          echo "IPv4:"
          wc -l output/microsoft365-ipv4.txt
          head -10 output/microsoft365-ipv4.txt

          echo "IPv6:"
          wc -l output/microsoft365-ipv6.txt
          head -10 output/microsoft365-ipv6.txt

      - name: Commit updated IP lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No Microsoft 365 IP changes detected."
            exit 0
          fi

          git commit -m "Update Microsoft 365 IP ranges"
          git push
